name: Manual Minute Motion Drafts
on:
  push:
    branches: [main, codex/manual-minute-motion]
    paths: ["manual-minute-v2/**", ".github/workflows/manual-minute-motion.yml"]
  workflow_dispatch:
    inputs:
      topic:
        description: Reviewed content batch
        type: choice
        default: next-batch
        options:
          - next-batch
          - all
          - model-y-screen-clean
          - model-y-usb
          - f150-global-opening
          - model-y-wiper-service
          - model-y-glovebox-pin
          - model-y-walkaway-lock
permissions:
  contents: read
concurrency:
  group: manual-minute-motion
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: manual-minute-v2/requirements.txt
      - uses: actions/cache@v4
        with:
          path: |
            manual-minute-v2/output/**/*.mp3
            manual-minute-v2/output/**/*.jsonl
          key: manual-minute-voice-v3-${{ hashFiles('manual-minute-v2/storyboards.json') }}
          restore-keys: manual-minute-voice-v3-
      - name: Restore finished renders
        uses: actions/cache@v4
        with:
          path: |
            manual-minute-v2/output/**/*.mp4
            manual-minute-v2/output/**/*.srt
            manual-minute-v2/output/**/metadata.json
            manual-minute-v2/output/**/words.json
            manual-minute-v2/output/**/timeline.json
            manual-minute-v2/output/**/script.txt
          key: manual-minute-renders-v1-${{ runner.os }}-${{ hashFiles('manual-minute-v2/*.py', 'manual-minute-v2/requirements.txt', 'manual-minute-v2/storyboards.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            manual-minute-renders-v1-${{ runner.os }}-${{ hashFiles('manual-minute-v2/*.py', 'manual-minute-v2/requirements.txt', 'manual-minute-v2/storyboards.json') }}-
            manual-minute-renders-v1-${{ runner.os }}-
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: python -m pip install -r manual-minute-v2/requirements.txt
      - name: Render and verify
        env:
          TOPIC: ${{ inputs.topic || 'all' }}
        run: |
          if [ "$TOPIC" = "next-batch" ]; then
            TOPIC="model-y-wiper-service,model-y-glovebox-pin,model-y-walkaway-lock"
          fi
          python manual-minute-v2/build.py --topic "$TOPIC"
          python manual-minute-v2/quality-check.py --topic "$TOPIC"
      - name: Package only verified selections
        run: python manual-minute-v2/package_verified.py
      - uses: actions/upload-artifact@v4
        with:
          name: manual-minute-verified-drafts
          path: manual-minute-v2/review-package/
          if-no-files-found: error
          retention-days: 7

